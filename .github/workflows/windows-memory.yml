name: Windows memory pipeline
on:
  push:
    branches: [feature/windows-live-memory-reader]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Recover prior test output
        if: contains(github.event.head_commit.message, '[inspect]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39994497821 --name Windows-x64-Release-and-evidence --dir build/native-windows
      - name: Inspect prior captured pixels
        if: contains(github.event.head_commit.message, '[inspect]')
        run: python tools/inspect_capture.py
      - name: Configure MSVC x64 Release
        if: ${{ !contains(github.event.head_commit.message, '[inspect]') }}
        run: cmake -S . -B build/native-windows -A x64 -DESP_BUILD_CONFIG_TESTS=ON -DESP_BUILD_RENDER_TESTS=ON -DESP_BUILD_TOOLS=ON
      - name: Build
        if: ${{ !contains(github.event.head_commit.message, '[inspect]') }}
        run: cmake --build build/native-windows --config Release --parallel 4
      - name: Test actual Windows APIs and DX11
        if: ${{ !contains(github.event.head_commit.message, '[inspect]') }}
        run: ctest --test-dir build/native-windows -C Release --output-on-failure --output-junit windows-tests.xml
      - name: Publish readable test diagnostics
        if: always()
        shell: pwsh
        run: |
          $log = "build/native-windows/Testing/Temporary/LastTest.log"
          if (Test-Path $log) {
            $blocks = (Get-Content $log -Raw) -split '(?m)(?=^\d+/\d+ Testing:)'
            foreach ($block in $blocks) {
              if ($block -notmatch 'Test Failed|Testing: windows_memory_') { continue }
              $text = $block.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::notice title=CTest individual result::$text"
            }
          }
          Get-ChildItem build/native-windows/windows-*-report.json -ErrorAction SilentlyContinue | ForEach-Object {
            $text = (Get-Content $_ -Raw).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::notice title=Windows process evidence::$text"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-x64-Release-and-evidence
          path: |
            build/native-windows/Release/
            build/native-windows/*.bmp
            build/native-windows/windows-*-report.json
            build/native-windows/windows-tests.xml
            build/native-windows/Testing/Temporary/LastTest.log
